[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenforge-bpe"
version = "0.1.0"
description = "Transparent, reversible byte-level BPE tokenizer with deterministic training"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
tokenforge = "tokenforge.cli:main"

[tool.setuptools.packages.find]
include = ["tokenforge*"]
